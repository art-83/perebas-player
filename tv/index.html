<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280, height=720, initial-scale=1">
  <title>Perebas Player</title>
  <style>
    html, body { margin: 0; width: 1280px; height: 720px; background: #000; color: #fff; font: 25px Arial, sans-serif; overflow: hidden; }
    #pluginPlayer { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; }
    #panel { position: absolute; left: 28px; top: 24px; padding: 16px 20px; background: rgba(0,0,0,.76); max-width: 1150px; }
    #status { font-size: 30px; }
    #details, #events { font-size: 19px; margin-top: 8px; }
  </style>
</head>
<body onload="Perebas.init()" onunload="Perebas.stop()">
  <object id="pluginPlayer" classid="clsid:SAMSUNG-INFOLINK-PLAYER"></object>
  <div id="panel">
    <div id="status">Iniciando...</div>
    <div id="details"></div>
    <div id="events"></div>
  </div>
  <script src="settings.js"></script>
  <script src="player.js"></script>
</body>
</html>
